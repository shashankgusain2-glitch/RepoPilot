services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: RepoPilot-postgres
    environment:
      POSTGRES_DB: RepoPilot
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - RepoPilot_pg_data:/var/lib/postgresql/data
      - ./docker/postgres/init-extensions.sql:/docker-entrypoint-initdb.d/01extensions.sql:ro

    healthcheck:
      test: ["CMD-SHELL","pg_isready -Upostgres -d RepoPilot"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  RepoPilot_pg_data: